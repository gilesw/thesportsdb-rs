# Regenerate from the workspace root with: mise run sdk:generate
# Spec source: https://www.thesportsdb.com/api/spec/v2/openapi.yaml

[generator]
spec_path = "specs/thesportsdb-v2.yaml"
output_dir = "src/v2/generated"
overlays = ["specs/v2.overlay.yaml"]
effective_spec = "effective.json"
module_name = "generated"

[features]
enable_async_client = true
enable_sse_client = false

[http_client]
base_url = "https://www.thesportsdb.com/api/v2/json"
timeout_seconds = 30
max_response_body_bytes = 8388608

[http_client.tracing]
enabled = false

[http_client.auth]
type = "ApiKey"
header_name = "X-API-KEY"
