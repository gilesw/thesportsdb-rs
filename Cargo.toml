[package]
name = "thesportsdb"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Unofficial typed async client for the TheSportsDB v1 and v2 JSON APIs"
license = "MIT OR Apache-2.0"
authors = ["Giles Westwood"]
readme = "README.md"
keywords = ["thesportsdb", "sports", "api", "client", "schedule"]
categories = ["api-bindings", "web-programming::http-client"]
include = [
  "/src/**/*.rs",
  "/README.md",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls", "stream"] }
reqwest-middleware = { version = "0.5", features = ["query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# 0.6.5 uses let chains and needs Rust 1.88.
wiremock = "=0.6.4"

[lints.rust]
unsafe_code = "forbid"
